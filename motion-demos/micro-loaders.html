<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro-interactions & Loaders</title>
<style>
  :root { --bg:#f4f1ea; --ink:#1b1a17; --a:#3a5bff; --b:#ff4f7b; --c:#12b981; --card:#fffdf8; --ease:cubic-bezier(.65,0,.35,1); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Helvetica Neue",Arial,sans-serif; padding:72px 5vw 6vh; }
  a.back { position:fixed; top:16px; left:20px; color:var(--ink); opacity:.5; font:500 13px/1 ui-monospace,monospace; text-decoration:none; }
  a.back:hover { opacity:1; }
  h1 { font-size:clamp(1.8rem,4vw,3rem); letter-spacing:-.03em; margin-bottom:.4em; }
  p.lead { opacity:.6; margin-bottom:2rem; max-width:52ch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid #0001; border-radius:18px; aspect-ratio:1; display:grid; place-items:center; position:relative; }
  .card small { position:absolute; bottom:12px; font:500 11px/1 ui-monospace,monospace; opacity:.45; }

  /* 1. orbiting dots */
  .orbit { width:70px; height:70px; position:relative; animation:spin 2.4s linear infinite; }
  .orbit i { position:absolute; width:14px; height:14px; border-radius:50%; background:var(--a); left:50%; top:50%; margin:-7px;
    transform:rotate(calc(var(--n) * 90deg)) translateY(-28px); animation:pulse 1.2s var(--ease) infinite; animation-delay:calc(var(--n) * -.3s); }
  .orbit i:nth-child(even) { background:var(--b); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 50% { transform:rotate(calc(var(--n) * 90deg)) translateY(-28px) scale(.4); } }

  /* 2. equalizer bars */
  .bars { display:flex; gap:6px; align-items:center; height:60px; }
  .bars i { width:8px; height:100%; border-radius:4px; background:var(--ink); transform-origin:center; animation:bar 1s var(--ease) infinite; animation-delay:calc(var(--n) * 110ms); }
  @keyframes bar { 0%,100% { transform:scaleY(.2); } 50% { transform:scaleY(1); } }

  /* 3. checkmark draw */
  .check svg { width:84px; height:84px; overflow:visible; }
  .check circle, .check path { fill:none; stroke:var(--c); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  .check circle { stroke-dasharray:252; stroke-dashoffset:252; animation:draw 3s var(--ease) infinite; transform-origin:center; transform:rotate(-90deg); }
  .check path { stroke-dasharray:60; stroke-dashoffset:60; animation:drawTick 3s var(--ease) infinite; }
  @keyframes draw { 0% { stroke-dashoffset:252; } 35%,85% { stroke-dashoffset:0; } 100% { stroke-dashoffset:-252; } }
  @keyframes drawTick { 0%,30% { stroke-dashoffset:60; } 50%,85% { stroke-dashoffset:0; } 100% { stroke-dashoffset:60; } }

  /* 4. morphing blob (SMIL path morph) */
  .morph svg { width:96px; height:96px; }

  /* 5. staggered squares */
  .squares { display:grid; grid-template-columns:repeat(3,18px); gap:6px; }
  .squares i { width:18px; height:18px; background:var(--b); border-radius:4px; animation:sq 1.6s var(--ease) infinite; animation-delay:calc((var(--x) + var(--y)) * 120ms); }
  @keyframes sq { 0%,100% { transform:scale(1) rotate(0); background:var(--b); } 50% { transform:scale(.55) rotate(90deg); border-radius:50%; background:var(--a); } }

  /* 6. liquid toggle */
  .toggle { appearance:none; width:96px; height:48px; border-radius:24px; background:#0002; position:relative; cursor:pointer; transition:background .4s var(--ease); outline-offset:4px; }
  .toggle::after { content:""; position:absolute; top:5px; left:5px; width:38px; height:38px; border-radius:24px; background:#fff; box-shadow:0 2px 6px #0003;
    transition:left .55s cubic-bezier(.34,1.56,.64,1), width .25s var(--ease); }
  .toggle:active::after { width:52px; }
  .toggle:checked { background:var(--c); }
  .toggle:checked::after { left:53px; }
  .toggle:checked:active::after { left:39px; }

  /* 7. press-and-hold button with fill */
  .hold { position:relative; overflow:hidden; border:0; border-radius:14px; padding:16px 22px; background:var(--ink); color:#fff; font:600 15px "Helvetica Neue",Arial; cursor:pointer; user-select:none; transition:transform .2s var(--ease); }
  .hold:active { transform:scale(.96); }
  .hold::before { content:""; position:absolute; inset:0; background:var(--a); transform:translateX(-101%); transition:transform .25s ease-out; }
  .hold.holding::before { transform:translateX(0); transition:transform 1.1s linear; }
  .hold span { position:relative; }

  /* 8. heart burst */
  .like { border:0; background:none; cursor:pointer; position:relative; width:80px; height:80px; }
  .like svg { width:60px; height:60px; fill:#0002; transition:fill .2s; }
  .like.on svg { fill:var(--b); animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform:scale(.4); } 100% { transform:scale(1); } }
  .like .spark { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:var(--b); opacity:0; }
  .like.on .spark { animation:burst .6s ease-out; }
  @keyframes burst { 0% { opacity:1; transform:rotate(var(--r)) translateY(0); } 100% { opacity:0; transform:rotate(var(--r)) translateY(-44px) scale(.4); } }

  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<a class="back" href="index.html">← all demos</a>
<h1>Micro-interactions</h1>
<p class="lead">Loaders run on their own. The toggle, hold button and heart respond to you.</p>
<div class="grid">
  <div class="card"><div class="orbit"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i></div><small>orbit</small></div>
  <div class="card"><div class="bars"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i></div><small>equalizer</small></div>
  <div class="card"><div class="check"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="40"/><path d="M25 44 L38 57 L60 30"/></svg></div><small>draw-on</small></div>
  <div class="card"><div class="morph">
    <svg viewBox="0 0 100 100"><path fill="#3a5bff">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".65 0 .35 1;.65 0 .35 1;.65 0 .35 1" keyTimes="0;.33;.66;1"
        values="M50 8 C75 8 92 25 92 50 C92 75 75 92 50 92 C25 92 8 75 8 50 C8 25 25 8 50 8Z;
                M50 6 C58 6 94 6 94 50 C94 94 58 94 50 94 C42 94 6 94 6 50 C6 6 42 6 50 6Z;
                M50 10 C70 30 90 30 90 50 C90 75 70 90 50 90 C30 90 10 75 10 50 C10 30 30 30 50 10Z;
                M50 8 C75 8 92 25 92 50 C92 75 75 92 50 92 C25 92 8 75 8 50 C8 25 25 8 50 8Z"/>
      <animate attributeName="fill" dur="4s" repeatCount="indefinite" values="#3a5bff;#ff4f7b;#12b981;#3a5bff"/>
    </path></svg></div><small>path morph</small></div>
  <div class="card"><div class="squares" id="sq"></div><small>wave stagger</small></div>
  <div class="card"><input class="toggle" type="checkbox" aria-label="Toggle demo"><small>liquid toggle</small></div>
  <div class="card"><button class="hold" id="hold"><span>Hold to confirm</span></button><small>press &amp; hold</small></div>
  <div class="card"><button class="like" id="like" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></button><small>tap</small></div>
</div>
<script>
  // squares grid
  const sq = document.getElementById("sq");
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) { const i = document.createElement("i"); i.style.setProperty("--x", x); i.style.setProperty("--y", y); sq.appendChild(i); }

  // hold button
  const hold = document.getElementById("hold"), label = hold.querySelector("span");
  let timer;
  const start = () => { hold.classList.add("holding"); timer = setTimeout(() => { label.textContent = "Confirmed ✓"; setTimeout(() => label.textContent = "Hold to confirm", 1500); }, 1100); };
  const stop = () => { clearTimeout(timer); hold.classList.remove("holding"); };
  hold.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(e => hold.addEventListener(e, stop));

  // like burst
  const like = document.getElementById("like");
  for (let i = 0; i < 8; i++) { const s = document.createElement("i"); s.className = "spark"; s.style.setProperty("--r", i * 45 + "deg"); like.appendChild(s); }
  like.addEventListener("click", () => {
    like.classList.remove("on"); void like.offsetWidth;
    if (!like.dataset.on) { like.classList.add("on"); like.dataset.on = 1; } else delete like.dataset.on;
  });
</script>
</body>
</html>
