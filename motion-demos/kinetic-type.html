<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic Type</title>
<style>
  :root { --bg:#0e0d0c; --fg:#f3ede2; --accent:#ff5b2e; --ease:cubic-bezier(.16,1,.3,1); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:"Helvetica Neue",Arial,sans-serif; min-height:100vh; overflow-x:hidden; display:grid; grid-template-rows:1fr auto; }
  a.back { position:fixed; top:16px; left:20px; color:var(--fg); opacity:.5; font:500 13px/1 ui-monospace,monospace; text-decoration:none; z-index:5; }
  a.back:hover { opacity:1; }

  main { display:grid; place-content:center; padding:12vh 5vw 4vh; gap:2vh; }

  /* --- Headline: letters rise from a mask with staggered spring --- */
  .headline { font-weight:800; font-size:clamp(3.5rem,17vw,15rem); line-height:.9; letter-spacing:-.05em; text-transform:uppercase; display:flex; flex-wrap:wrap; }
  .headline .ch { display:inline-block; overflow:hidden; padding:.04em .01em; }
  .headline .ch > span {
    display:inline-block; transform:translateY(110%) rotate(8deg);
    animation:rise 1.1s var(--ease) forwards; animation-delay:calc(var(--i) * 70ms + 200ms);
    transition:transform .5s var(--ease), color .3s;
  }
  .headline .ch:hover > span { color:var(--accent); transform:translateY(-6%) skewX(-8deg); transition-duration:.15s; }
  @keyframes rise { to { transform:translateY(0) rotate(0); } }

  /* --- Word swapper --- */
  .swap { font:600 clamp(1.2rem,3.4vw,2.6rem)/1.2 Georgia,serif; font-style:italic; display:flex; gap:.4em; align-items:baseline; opacity:0; animation:fade .8s 1.3s forwards; }
  .swap .slot { display:inline-block; height:1.2em; overflow:hidden; color:var(--accent); }
  .swap .slot ul { list-style:none; padding:0; animation:slot 9s var(--ease) infinite; }
  .swap .slot li { height:1.2em; }
  @keyframes slot {
    0%,20%   { transform:translateY(0); }
    25%,45%  { transform:translateY(-1.2em); }
    50%,70%  { transform:translateY(-2.4em); }
    75%,95%  { transform:translateY(-3.6em); }
    100%     { transform:translateY(-4.8em); }
  }
  @keyframes fade { to { opacity:1; } }

  /* --- Weight wave (variable-feel via text-shadow + scale, works with any font) --- */
  .wave { font:800 clamp(1.5rem,5vw,4rem)/1 "Helvetica Neue",Arial,sans-serif; letter-spacing:.02em; display:flex; flex-wrap:wrap; margin-top:4vh; }
  .wave span { display:inline-block; white-space:pre; animation:wave 2.4s ease-in-out infinite; animation-delay:calc(var(--i) * 90ms); }
  @keyframes wave {
    0%,100% { transform:translateY(0) scaleY(1); color:var(--fg); }
    50%     { transform:translateY(-.25em) scaleY(1.15); color:var(--accent); }
  }

  /* --- Marquee (two rows, opposite directions, outline vs. fill) --- */
  .marquees { border-block:1px solid #ffffff22; padding-block:1.2rem; overflow:hidden; display:grid; gap:.6rem; }
  .row { display:flex; width:max-content; animation:scroll 28s linear infinite; font:800 clamp(2rem,6vw,5rem)/1 "Helvetica Neue",Arial,sans-serif; text-transform:uppercase; letter-spacing:-.02em; }
  .row.rev { animation-direction:reverse; animation-duration:36s; }
  .row span { padding-right:.6em; white-space:nowrap; }
  .row.outline span { color:transparent; -webkit-text-stroke:1.5px var(--fg); }
  .marquees:hover .row { animation-play-state:paused; }
  @keyframes scroll { to { transform:translateX(-50%); } }

  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; animation-delay:0s !important; }
    .headline .ch > span { transform:none; }
    .swap { opacity:1; }
  }
</style>
</head>
<body>
<a class="back" href="index.html">← all demos</a>
<main>
  <h1 class="headline" id="headline" aria-label="Motion"></h1>
  <p class="swap"><span>Design that feels</span>
    <span class="slot" aria-hidden="true"><ul><li>alive.</li><li>tactile.</li><li>rhythmic.</li><li>inevitable.</li><li>alive.</li></ul></span>
  </p>
  <div class="wave" id="wave" aria-hidden="true"></div>
</main>
<div class="marquees" aria-hidden="true">
  <div class="row"><span>Ease in</span><span>Ease out</span><span>Overshoot</span><span>Settle</span><span>Ease in</span><span>Ease out</span><span>Overshoot</span><span>Settle</span></div>
  <div class="row rev outline"><span>Stagger</span><span>Anticipate</span><span>Follow through</span><span>Stagger</span><span>Anticipate</span><span>Follow through</span></div>
</div>
<script>
  const split = (el, text, wrap) => {
    [...text].forEach((c, i) => {
      const s = document.createElement("span");
      s.style.setProperty("--i", i);
      if (wrap) { s.className = "ch"; s.innerHTML = "<span></span>"; s.firstChild.textContent = c; }
      else s.textContent = c;
      el.appendChild(s);
    });
  };
  split(document.getElementById("headline"), "Motion", true);
  split(document.getElementById("wave"), "Everything moves with intent ", false);
</script>
</body>
</html>
